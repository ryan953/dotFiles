[general]
import = [
  "${HOME}/.config/alacritty/main.toml",
  # One generated file per source, see generators/.config/alacritty/
  "${HOME}/.config/alacritty/hints-github.toml",
  "${HOME}/.config/alacritty/hints-linear.toml",
  "${HOME}/.config/alacritty/hints-dex.toml",
]

[font]
size = 13.0

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\n"

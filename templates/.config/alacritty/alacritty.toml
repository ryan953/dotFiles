[general]
import = [
  "${HOME}/.config/alacritty/main.toml",
  # GitHub + Linear issue hints, generated by generators/.config/alacritty/hints.toml
  "${HOME}/.config/alacritty/hints.toml",
  # dex task ids, generated by generators/.config/alacritty/hints-dex.toml
  "${HOME}/.config/alacritty/hints-dex.toml",
]

[font]
size = 13.0

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\n"

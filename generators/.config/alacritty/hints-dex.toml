#!/usr/bin/env bash
set -e

# Generates ~/.config/alacritty/hints-dex.toml, the hint rule that makes dex
# task ids clickable:
#
#   r3jiacqe          -> the task, wherever the id is written
#   [ ] r3jiacqe:     -> the same, as dex list/show prints it
#
# dex ids are eight lowercase letters and digits with no prefix, so there is no
# pattern that separates them from git short shas or ordinary words. The ids in
# the store are listed out one by one instead, which is exact. Ids created
# after this ran are still caught in dex's own output, by the bracketed form.
# Both live in a single regex so that dex output never draws two hints on top
# of each other.
#
# A LaunchAgent keeps this current: com.ryan953.alacritty-hints-dex watches the
# task store and calls ~/bin/alacritty-hints-dex-refresh, which reruns this.
#
# Run now: alacritty-hints-dex-refresh
# Or re-run every generator: ~/.dotFiles/install-zsh.sh

# Where a task opens, with {id} standing in for the task id. The task: scheme
# is claimed by the dex UI app. Empty falls back to the task JSON file.
TASK_URL="task://dex/{id}"

opener="$HOME/bin/alacritty-hint-open"

# `path = "/Users/ryan953/.dex"` under [storage.file], the dex default.
store="$(sed -n 's/^path[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
  "$HOME/.config/dex/dex.toml" 2>/dev/null | head -1)"
store="${store:-$HOME/.dex}"

# dex 0.16 keeps every task on one line of tasks.jsonl. Older versions kept a
# file per task under tasks/, which is still read when that is what is there.
ids=""
if [ -f "$store/tasks.jsonl" ]; then
  if command -v jq > /dev/null; then
    ids="$(jq -r 'select(.id) | .id' "$store/tasks.jsonl" 2>/dev/null)"
  else
    ids="$(grep -o '"id"[[:space:]]*:[[:space:]]*"[a-z0-9]\{8\}"' "$store/tasks.jsonl" | cut -d'"' -f4)"
  fi
elif [ -d "$store/tasks" ]; then
  ids="$(cd "$store/tasks" && ls -1 2>/dev/null | sed -n 's/\.json$//p')"
fi

# Sorted output keeps the file from churning between runs. Length ordering is
# pointless here, every id is eight characters.
ids="$(printf '%s\n' "$ids" | grep '^[a-z0-9]\{8\}$' | sort -u | tr '\n' '|' | sed 's/|$//' || true)"
count="$(awk -F'|' '{print NF}' <<<"${ids:-}" 2>/dev/null || echo 0)"
[ -n "$ids" ] || count=0

# The bracketed form comes first so that a hint over dex output covers the
# whole "[ ] id:" run rather than starting part way through it.
alternatives='\[[ x]\] [a-z0-9]{8}:'
[ -z "$ids" ] || alternatives="$alternatives|$ids"

args="\"--dex-store\", \"$store\""
opens="the task JSON file"
if [ -n "$TASK_URL" ]; then
  args="$args, \"--url-template\", \"$TASK_URL\""
  opens="$TASK_URL"
fi

cat <<TOML
# GENERATED by ~/.dotFiles/generators/.config/alacritty/hints-dex.toml
#
# Task store: $store
# Task ids: $count listed, plus anything dex prints as "[ ] id:".
# Opens: $opens
# Generated: $(date '+%Y-%m-%d')

[[hints.enabled]]
regex = '($alternatives)'
command = { program = "$opener", args = [$args] }

[hints.enabled.binding]
key = "D"
mods = "Control|Shift"

[hints.enabled.mouse]
enabled = true
mods = "None"
TOML

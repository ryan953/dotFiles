#!/usr/bin/env bash
set -e

# Generates ~/.config/alacritty/hints-github.toml, the hint rule that makes a
# GitHub issue reference in the terminal clickable:
#
#   getsentry/sentry-toolbar#272  -> the issue, or the pull request
#
# Nothing here needs looking up. It is generated all the same because Alacritty
# runs hint commands without a shell and without expanding $HOME, so the path
# to the opener has to be written out in full, per machine.
#
# Run now: ~/.dotFiles/generators/.config/alacritty/hints-github.toml > ~/.config/alacritty/hints-github.toml
# Or re-run every generator: ~/.dotFiles/install-zsh.sh

opener="$HOME/bin/alacritty-hints"

cat <<TOML
# GENERATED by ~/.dotFiles/generators/.config/alacritty/hints-github.toml
#
# Generated: $(date '+%Y-%m-%d')

# owner/repo#1234 -> the issue or the pull request, whichever 1234 turns out to
# be: GitHub redirects /issues/1234 to /pull/1234 on its own.
[[hints.enabled]]
regex = '[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9._-]+#[0-9]+'
command = { program = "$opener", args = ["open"] }

[hints.enabled.binding]
key = "G"
mods = "Control|Shift"

[hints.enabled.mouse]
enabled = true
mods = "None"
TOML

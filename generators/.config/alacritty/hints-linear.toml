#!/usr/bin/env bash
set -e

# Generates ~/.config/alacritty/hints-linear.toml, the hint rules that make
# Linear issue ids in the terminal clickable:
#
#   REPLAY-431, AIML-3317, INC-2161, ...  -> the Linear issue
#
# The prefixes are read from the workspace itself with the `linear` CLI, so
# this is regenerated rather than kept by hand. Teams land in one of two rules:
#
#   * my team chain -- the teams I'm on, everything above them, and everything
#     nested below them. Clickable AND reachable with the Ctrl+Shift+L jump
#     binding, including two letter keys like GO or IS.
#   * every other team -- clickable only, and keys shorter than three letters
#     are dropped so that "GO-1" in a changelog stays plain text.
#
# Opening a match is left to ~/bin/alacritty-hint-open. Its path is written out
# absolute, because Alacritty runs hint commands without a shell and without
# expanding $HOME.
#
# With no workspace or no `linear` CLI this writes a header and no rules, which
# leaves Linear ids as plain text and everything else untouched.
#
# Run now: ~/.dotFiles/generators/.config/alacritty/hints-linear.toml > ~/.config/alacritty/hints-linear.toml
# Or re-run every generator: ~/.dotFiles/install-zsh.sh

# Team keys that match too much ordinary text to be worth linking.
EXCLUDE=""

# Where a Linear issue opens, with {id} standing in for an id like REPLAY-431.
# The task: scheme is claimed by the dex UI app, which is preferred over the
# website. Empty falls back to linear.app.
ISSUE_URL="task://linear/{id}"

opener="$HOME/bin/alacritty-hint-open"

# `default = "getsentry"`, as written by the linear CLI.
workspace="$(sed -n 's/^default[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
  "$HOME/.config/linear/credentials.toml" 2>/dev/null | head -1)"

teams=""
if [ -z "$workspace" ]; then
  echo "$(basename "$0"): no Linear workspace, run \`linear auth login\`" >&2
elif ! command -v linear > /dev/null || ! command -v jq > /dev/null; then
  echo "$(basename "$0"): needs the linear CLI and jq" >&2
else
  teams="$(linear api 'query { viewer { teams(first: 250) { nodes { key } } } teams(first: 250) { nodes { key parent { key } } } }' 2>/dev/null || true)"
  if [ "$(jq -r '.data.teams.nodes | length' <<<"${teams:-{\}}" 2>/dev/null || echo 0)" -eq 0 ]; then
    echo "$(basename "$0"): Linear returned no teams, writing no rules" >&2
    teams=""
  fi
fi

linear_args="\"--workspace\", \"$workspace\""
opens="the Linear website"
if [ -n "$ISSUE_URL" ]; then
  linear_args="$linear_args, \"--url-template\", \"$ISSUE_URL\""
  opens="$ISSUE_URL"
fi

chain_re=""
rest_re=""
counts="0 0"
if [ -n "$teams" ]; then
  # Split the keys into the two tiers, longest first so that an alternation
  # never settles for a key that prefixes another one (IS before ISWF).
  keys="$(jq -r --arg exclude "$EXCLUDE" '
    def order: sort_by(-length, .) | join("|");
    .data as $d
    | ([$exclude | split(",")[] | ascii_upcase | select(length > 0)]) as $skip
    | ([$d.teams.nodes[] | select(.parent.key != null) | {(.key): .parent.key}] | add // {}) as $parent
    | [$d.teams.nodes[].key] as $all
    | [$d.viewer.teams.nodes[].key] as $mine
    | ([$mine[] | recurse($parent[.] | select(. != null))] | unique) as $up
    | (reduce range(0; 12) as $_ ($up;
        . as $set | $set + [$all[] | select($parent[.] as $p | $p != null and ($set | index($p)))] | unique
      )) as $chain
    | (($chain - $skip)) as $chain
    | (($all - $chain - $skip) | map(select(length >= 3))) as $rest
    | "\($chain | order)\n\($rest | order)\n\($chain | length) \($rest | length)"
  ' <<<"$teams")"
  chain_re="$(sed -n 1p <<<"$keys")"
  rest_re="$(sed -n 2p <<<"$keys")"
  counts="$(sed -n 3p <<<"$keys")"
fi

cat <<TOML
# GENERATED by ~/.dotFiles/generators/.config/alacritty/hints-linear.toml
#
# Workspace: ${workspace:-none}
# Teams: $(cut -d' ' -f1 <<<"$counts") in my chain, $(cut -d' ' -f2 <<<"$counts") elsewhere in the workspace.
# Issues open: $opens
# Generated: $(date '+%Y-%m-%d')
TOML

[ -n "$chain_re" ] || exit 0
cat <<TOML

# My team chain: the teams I'm on, their parents, and everything nested below
# them. Click to open, or Ctrl+Shift+L to pick one out by keyboard.
[[hints.enabled]]
regex = '($chain_re)-[0-9]+'
command = { program = "$opener", args = [$linear_args] }

[hints.enabled.binding]
key = "L"
mods = "Control|Shift"

[hints.enabled.mouse]
enabled = true
mods = "None"
TOML

[ -n "$rest_re" ] || exit 0
cat <<TOML

# Every other team in the workspace: click to open. Two letter keys are left
# out here on purpose, they collide with ordinary text too often.
[[hints.enabled]]
regex = '($rest_re)-[0-9]+'
command = { program = "$opener", args = [$linear_args] }

[hints.enabled.mouse]
enabled = true
mods = "None"
TOML
